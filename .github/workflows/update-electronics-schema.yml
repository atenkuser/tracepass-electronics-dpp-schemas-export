name: Elektronik-Schema täglich aktualisieren

on:
  schedule:
    # täglich um 06:15 UTC
    - cron: "15 6 * * *"

  # Ermöglicht den manuellen Start über die GitHub-Weboberfläche
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-electronics-schema
  cancel-in-progress: false


jobs:
  update-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aktuelle Quelle herunterladen
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/electronics.json \
            "https://raw.githubusercontent.com/malinoto/tracepass-dpp-schemas/main/templates/electronics.json"

  
      - name: Prüfen, ob die Quelle geändert wurde
        id: source_check
        run: |
          if [ ! -f "source/electronics.json" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Erster Lauf: noch keine Vergleichsdatei vorhanden."
          else
            python - <<'PY'
          import json
          from pathlib import Path

          upstream = json.loads(Path("/tmp/electronics.json").read_text(encoding="utf-8"))
          local = json.loads(Path("source/electronics.json").read_text(encoding="utf-8"))

          if upstream == local:
              with open(Path.cwd() / ".github_output", "w") as f:
                  f.write("changed=false\n")
          else:
              with open(Path.cwd() / ".github_output", "w") as f:
                  f.write("changed=true\n")
          PY
            cat .github_output >> "$GITHUB_OUTPUT"

      - name: Excel-Datei erzeugen
        if: steps.source_check.outputs.changed == 'true'
        run: |
          cp /tmp/electronics.json source/electronics.json
          python scripts/generate_excel.py \
            --input source/electronics.json \
            --output datenpunkte_Schema.xlsx

      - name: Ergebnis committen und pushen
        if: steps.source_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source/electronics.json datenpunkte_Schema.xlsx

          if git diff --cached --quiet; then
            echo "Keine Dateiänderungen zum Committen."
          else
            git commit -m "chore: electronics-Schema aktualisieren"
            git push
          fi
